# Channel model for the FR2 64SSB beam-switch integration test.
#
# Keep the model names compatible with RFsim ChMod file injection while using
# very low AWGN. The generic channelmod_rfsimu.conf uses a high noise floor for
# rfsimu_channel_ue0, which can make PRACH noise estimation mask real Msg1.
channelmod = {
  max_chan = 10;
  modellist = "modellist_rfsimu_beam_symbol";
  modellist_rfsimu_beam_symbol = (
    {
      model_name = "rfsimu_channel_enB0";
      type = "AWGN";
      ploss_dB = 0;
      noise_power_dB = -120;
      forgetfact = 0;
      offset = 0;
      ds_tdl = 0;
    },
    {
      model_name = "rfsimu_channel_ue0";
      type = "AWGN";
      ploss_dB = 0;
      noise_power_dB = -120;
      forgetfact = 0;
      offset = 0;
      ds_tdl = 0;
    }
  );
};
